schema_version: "1.0"
kind: benchmark

benchmark:
  id: competition_math
  version: "local-hf-snapshot"
  protocol_version: "boxed-math-equivalence-v1"
  description: MATH competition problems with step-by-step reference solutions
  task_type: question_answering
  tags: [math, reasoning, latex, competition]

dataset:
  loader:
    type: jsonl
    paths:
      train: ../../../benchmark/competition_math/competition_math.jsonl
    encoding: utf-8
  integrity:
    expected_samples: {train: 12500}
    sha256:
      train: e8d20c4ad999ee5615d9a0ea417ed79736ee65d9872460e21be5b0aca60ad44d
  sample_id:
    field: null
    strategy: content_hash
  fields:
    question: problem
    reference_answer: solution
    difficulty: level
    category: type
  filters: []

input_adapter:
  type: template
  input_fields: [problem]
  template: |-
    Solve the following mathematics problem. Show your reasoning and put only
    the final answer inside \boxed{...}.

    {{ problem }}
  output:
    messages:
      - role: user
        content: "{{ rendered_input }}"

agent_contract:
  input_schema: agent-input/v1
  output_schema: agent-output/v1
  required_capabilities: []
  allowed_tools: []

execution_environment:
  dependencies: {type: current_environment}
  sandbox: {type: none}

runtime:
  limits:
    max_turns: 1
    max_steps: 20
    max_tool_calls: 0
    tokens: {max_total: 16384, max_output_per_call: 4096}
    time: {sample_timeout_seconds: 300, tool_call_timeout_seconds: 30}
  accounting: {failed_tool_calls: count, parallel_tool_calls: per_call, cached_model_calls: count}

output_adapter:
  type: boxed_latex_extract
  source: final_answer
  on_no_match: invalid_prediction
  output: {id_field: sample_id, prediction_field: answer}
  normalization: [strip, normalize_latex]

reference_adapter:
  type: boxed_latex_extract
  source_field: reference_answer
  output_field: reference
  normalization: [strip, normalize_latex]

submission:
  builder: {type: jsonl, sort_by: sample_id, required_fields: [sample_id, answer], missing_prediction_policy: error}
  output: {filename: predictions.jsonl}

evaluator:
  mode: sample
  type: builtin
  implementation: math_equivalence
  version: "1"
  prediction_field: answer
  reference_field: reference
  metrics:
    - {id: accuracy, primary: true, direction: maximize, range: [0, 1]}

reproducibility: {random_seed: 42, shuffle: false}
provenance:
  homepage: https://github.com/hendrycks/math
  license: MIT
  citation: "Hendrycks et al., Measuring Mathematical Problem Solving With the MATH Dataset (2021)"

