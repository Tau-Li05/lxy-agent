schema_version: "2.0"
dataset:
  name: locomo
  path: ../../../data/evaluation/locomo_10pct.jsonl
task_family: multiturn
agent:
  runtime: langchain
  max_steps: 20
  sample_timeout_seconds: 3600
tool:
  enabled: true
  provider: locomo_memory
  schema_source: dataset
  execution: enabled
model:
  profiles:
    v4flash:
      name: DeepSeek-V4-Flash
      context_window: 65536
      max_tokens: 4096
      temperature: 0
      base_url_env: FIRE_AGENT_BASE_URL
      api_key_env: FIRE_AGENT_API_KEY
    pro:
      name: deepseek-v4-pro
      context_window: 65536
      max_tokens: 4096
      temperature: 0
      base_url_env: FIRE_AGENT_BASE_URL
      api_key_env: FIRE_AGENT_API_KEY
    qwen3_5_9b:
      provider: ollama
      name: qwen3.5:9b
      context_window: 65536
      max_tokens: 4096
      temperature: 0
      host: http://127.0.0.1:11434
      host_env: OLLAMA_HOST
  default_profile: v4flash
  reasoning: {enabled: false, mode: high}
prompt:
  system: >-
    You manage durable memory for a long-running conversation. During ingestion,
    store self-contained facts, events, dates, relationships, preferences, and
    corrections using the memory tools. During evaluation, retrieve relevant
    memories before answering. Give a concise answer; if the memory does not
    contain enough information, answer exactly: No information available.
