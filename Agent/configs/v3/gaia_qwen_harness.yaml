schema_version: "3.0"
dataset: {name: gaia, path: ../../../data/evaluation/gaia_validation.jsonl}
task_family: single_turn
runtime: {kind: qwen_harness}
agent: {max_steps: 24, sample_timeout_seconds: 900}
tool: {enabled: true, provider: gaia, schema_source: registry, execution: enabled}
model:
  profiles:
    qwen3_5_4b:
      {provider: ollama, name: "qwen3.5:4b", context_window: 1331072, max_tokens: 16384,
       temperature: 0, host: "http://127.0.0.1:11434", host_env: OLLAMA_HOST}
    qwen3_5_9b:
      {provider: ollama, name: "qwen3.5:9b", context_window: 1331072, max_tokens: 16384,
       temperature: 0, host: "http://127.0.0.1:11434", host_env: OLLAMA_HOST}
  default_profile: qwen3_5_9b
  reasoning: {enabled: false, mode: high}
prompt:
  system: >-
    Solve the GAIA task using a concise explicit plan and the available tools. Revise the plan after
    a failed external action. End with a final line containing only #### followed by the final answer.
features:
  system_prompt: {enabled: true, base: true, project_rules: true, environment_info: true}
  tools: {enabled: true, execution: true}
  parallel_tools: {enabled: true, max_concurrency: 4}
  planning: {enabled: true}
  verification: {enabled: false}
  compaction: {enabled: false}
  self_correction: {enabled: false}
  web_search: {enabled: true}
  memory: {enabled: false}
  math_tools: {mode: none}
  output_recovery: {enabled: false, max_retries: 0}
retry:
  timeout: {enabled: true, max_retries: 2}
  transport: {enabled: true, max_retries: 2}
  malformed_response: {enabled: true, max_retries: 2}
limits: {max_model_turns: 24, max_tool_calls: 32, max_total_tokens: 262144}
