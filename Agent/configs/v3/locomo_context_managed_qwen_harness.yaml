schema_version: "3.0"
dataset: {name: locomo, path: ../../../data/evaluation/locomo_10pct.jsonl}
task_family: multiturn
runtime: {kind: qwen_harness}
agent: {max_steps: 1, sample_timeout_seconds: 3600}
tool: {enabled: false, provider: none, schema_source: none, execution: disabled}
model:
  profiles:
    qwen3_5_4b: {provider: ollama, name: "qwen3.5:4b", context_window: 1331072, max_tokens: 16384, temperature: 0, host: "http://127.0.0.1:11434", host_env: OLLAMA_HOST}
    qwen3_5_9b: {provider: ollama, name: "qwen3.5:9b", context_window: 1331072, max_tokens: 16384, temperature: 0, host: "http://127.0.0.1:11434", host_env: OLLAMA_HOST}
  default_profile: qwen3_5_9b
  reasoning: {enabled: false, mode: high}
prompt: {system: "Answer each question from the managed conversation context. Return only the short answer."}
features:
  tools: {enabled: false, execution: false}
  planning: {enabled: false}
  verification: {enabled: false}
  compaction:
    enabled: true
    trigger_ratio: 0.80
    target_ratio: 0.65
    tool_result_max_characters: 50000
    tool_result_preview_characters: 2000
    preserve_recent_messages: 12
    collapse_summary_characters: 12000
  self_correction: {enabled: false}
  web_search: {enabled: false}
  memory: {enabled: false, mode: full_context}
  math_tools: {mode: none}
  output_recovery: {enabled: false, max_retries: 0}
retry:
  timeout: {enabled: true, max_retries: 2}
  transport: {enabled: true, max_retries: 2}
  malformed_response: {enabled: false, max_retries: 0}
limits: {max_model_turns: 1, max_tool_calls: 0, max_total_tokens: 262144}
