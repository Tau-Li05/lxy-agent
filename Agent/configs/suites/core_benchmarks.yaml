schema_version: "1.0"
kind: suite

suite:
  id: core-benchmarks
  version: "1.0"
  description: Math, general-agent and function-calling benchmark suite

defaults:
  runtime:
    limits:
      max_turns: 1
      max_steps: 20
      max_tool_calls: 10
      tokens:
        max_total: 16384
        max_output_per_call: 4096
      time:
        sample_timeout_seconds: 300
        tool_call_timeout_seconds: 60
  execution:
    retries: 1

benchmarks:
  - config: ../benchmarks/competition_math.yaml
    enabled: true
    splits: [train]
    limit: null
    weight: 1.0
  - config: ../benchmarks/aime24.yaml
    enabled: true
    splits: [test]
    limit: null
    weight: 1.0
  - config: ../benchmarks/aime25.yaml
    enabled: true
    splits: [test]
    limit: null
    weight: 1.0
  - config: ../benchmarks/aime26.yaml
    enabled: true
    splits: [test]
    limit: null
    weight: 1.0
  - config: ../benchmarks/gaia.yaml
    enabled: true
    splits: [validation]
    limit: null
    weight: 1.0
    overrides:
      runtime:
        limits:
          max_turns: 20
          max_steps: 100
          max_tool_calls: 80
          time:
            sample_timeout_seconds: 1800
  - config: ../benchmarks/bfcl_v4.yaml
    enabled: true
    splits: [test]
    limit: null
    weight: 1.0
    overrides:
      runtime:
        limits:
          max_turns: 20
          max_steps: 100
          max_tool_calls: 80
          time:
            sample_timeout_seconds: 600
  - config: ../benchmarks/gsm8k.yaml
    enabled: true
    splits: [test]
    limit: null
    weight: 1.0
  - config: ../benchmarks/livebench_math.yaml
    enabled: true
    splits: [test]
    limit: null
    weight: 1.0

execution:
  concurrency: 4
  fail_fast: false
  random_seed: 42

aggregation:
  composite_score: null
  missing_result_policy: error

report:
  output_directory: ../../runs/${RUN_ID}
  formats: [json, jsonl]
  include_per_sample_results: true
  include_resolved_config: true

